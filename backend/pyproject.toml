[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pangenome-explorer-backend"
version = "0.1.0"
description = "FastAPI backend serving gig_map_io pangenome analyses"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyarrow",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "xgboost",
    "shap",
    "statsmodels",
    "biopython",
    "plotly",
    "gig_map_io @ git+https://github.com/sminot/gig-map-io.git",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
