<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pangenome Viewer</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      /* Page-level only. Everything else lives under .gmd-root in style.css. */
      html, body { height: 100%; margin: 0; overflow: hidden; background: #1a1a2e; }
      #app { height: 100%; }
    </style>

    <!--
      The app is plain ES modules with relative imports, so any static file server
      can host it with no build step. The import map is what lets d3 and Papa Parse
      be written as bare specifiers here and resolved by a bundler in the library
      build. Keep the two lists in sync with package.json dependencies.
    -->
    <script type="importmap">
      {
        "imports": {
          "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
          "papaparse": "https://cdn.jsdelivr.net/npm/papaparse@5.4.1/+esm"
        }
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="src/standalone.js"></script>
  </body>
</html>
