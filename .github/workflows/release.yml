name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      # The standalone app has no build step — it is the source plus index.html — so
      # the archive is what you unzip next to a data/ folder and serve. dist/ and
      # types/ are the library build, for consumers that pin the tag with npm.
      - name: Create release zip
        run: |
          zip -r pangenome-viewer-${{ github.ref_name }}.zip \
            index.html \
            style.css \
            pangenome-loader.js \
            src \
            schema \
            types \
            dist \
            package.json \
            README.md \
            DESIGN.md \
            LICENSE

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pangenome-viewer-${{ github.ref_name }}.zip
