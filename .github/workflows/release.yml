name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release zip
        run: |
          zip pangenome-viewer-${{ github.ref_name }}.zip \
            index.html \
            style.css \
            annotation.js \
            app.js \
            controls.js \
            data-contract.js \
            export.js \
            genome-annotation.js \
            genome-viz.js \
            selection.js \
            webgl-renderer.js \
            zoom-contract.js \
            zoom-interaction.js \
            zoom-state.js

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pangenome-viewer-${{ github.ref_name }}.zip
