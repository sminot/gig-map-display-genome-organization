name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repository root *is* the deployable app: index.html loads src/ as ES
      # modules and an import map resolves d3 and Papa Parse from a CDN. There is
      # deliberately no app build step to run here.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,example,test,node_modules,dist,types,DESIGN.md,README.md,package.json,package-lock.json,vite.config.js,playwright.config.js'
          # For PRs: deploy to a subdirectory so each PR gets its own preview URL
          destination_dir: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '.' }}
